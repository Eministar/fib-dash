# Desktop-App: bei Änderungen in desktop/ Windows-Installer bauen, signieren und
# per HTTPS ans Dashboard schicken. Das Dashboard bietet ihn unter /desktop zum Download an,
# installierte Apps holen ihn sich über /api/desktop/updates/latest.json selbst.
#
# EINRICHTUNG (einmalig) — GitHub → Settings → Secrets and variables → Actions:
#   DASHBOARD_URL (Variable oder Secret)    Öffentliche Dashboard-URL, z. B. https://dashboard.tld
#   Secret    TAURI_SIGNING_PRIVATE_KEY     Inhalt von ~/.tauri/fib-desktop.key (Update-Signatur)
#   Secret    DESKTOP_RELEASE_TOKEN         Beliebiger langer Zufallswert; derselbe Wert steht
#                                           auf dem Server in der .env (DESKTOP_RELEASE_TOKEN=…)
#
# Die Version ist 1.0.<Laufnummer>, steigt also bei jedem Lauf automatisch.

name: Desktop-App

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch: {}

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || secrets.DASHBOARD_URL }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Einrichtung prüfen
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DESKTOP_RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          [[ "$DASHBOARD_URL" == https://* ]] || { echo "::error::DASHBOARD_URL (Variable oder Secret) fehlt oder beginnt nicht mit https://"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt."; exit 1; }
          [ -n "$DESKTOP_RELEASE_TOKEN" ] || { echo "::error::Secret DESKTOP_RELEASE_TOKEN fehlt."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Installer bauen und signieren
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          # Adresse, die die App für Login und Uploads nutzt (src-tauri/src/api.rs).
          export FIB_DASHBOARD_URL="${DASHBOARD_URL%/}"
          # Version und Update-Adresse kommen erst hier in die App.
          node -e '
            const [version, url] = process.argv.slice(1)
            const endpoint = url.replace(/\/$/, "") + "/api/desktop/updates/latest.json"
            // Lokal darf der Updater http (localhost), ausgeliefert wird nur https.
            const config = { version, plugins: { updater: { endpoints: [endpoint], dangerousInsecureTransportProtocol: false } } }
            require("fs").writeFileSync("release.conf.json", JSON.stringify(config))
          ' "$VERSION" "$DASHBOARD_URL"
          npx tauri build --config release.conf.json

      - name: Installer bereitstellen
        run: |
          BUNDLE="src-tauri/target/release/bundle/nsis/FIB Desktop_${VERSION}_x64-setup.exe"
          mkdir -p out
          cp "$BUNDLE" "out/FIB-Desktop-Setup-${VERSION}.exe"
          cp "$BUNDLE.sig" "out/FIB-Desktop-Setup-${VERSION}.exe.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: desktop/out/
          retention-days: 7

      - name: Ans Dashboard hochladen
        env:
          DESKTOP_RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          NOTES: ${{ github.event.head_commit.message || 'Manueller Build' }}
        run: |
          FILE="out/FIB-Desktop-Setup-${VERSION}.exe"
          printf '%s' "$NOTES" > out/notes.txt
          # „<datei“ liest den Feldwert aus der Datei – so landen Signatur und
          # Commit-Text unverändert im Formular, ohne Shell-Quoting.
          curl --fail-with-body -sS --retry 2 \
            -H "Authorization: Bearer $DESKTOP_RELEASE_TOKEN" \
            -F "installer=@$FILE;type=application/octet-stream" \
            -F "version=$VERSION" \
            -F "signature=<$FILE.sig" \
            -F "notes=<out/notes.txt" \
            "${DASHBOARD_URL%/}/api/desktop/releases"
