[package]
name = "fib-desktop"
version = "1.0.0"
edition = "2021"

[lib]
name = "fib_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
winreg = "0.56.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Security_Credentials"] }
tokio = { version = "1.54.1", features = ["time", "sync", "fs", "io-util", "rt", "macros"] }

# Kleine, schnelle Release-Binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
